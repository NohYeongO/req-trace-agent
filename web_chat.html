<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>요구사항 진척 관리</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #1e1e2e; --panel: #262638; --line: #3a3a52; --text: #e2e2f0; --muted: #9a9ac0;
    --accent: #5b5bd6; --accent-text: #8b8bd8; --bubble: #2e2e42; --ok: #7ee787;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    font-family: -apple-system, "Apple SD Gothic Neo", sans-serif;
    background: var(--bg); color: var(--text); overflow: hidden;
  }
  #app { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  header {
    display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
    padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--line);
  }
  header h1 { margin: 0; font-size: 15px; font-weight: 600; }
  header .meta { color: var(--accent-text); font-size: 12px; }
  nav { display: flex; gap: 4px; margin-left: auto; }
  nav button {
    padding: 7px 14px; border-radius: 8px; border: 1px solid transparent; background: none;
    color: var(--muted); font-size: 13px; cursor: pointer;
  }
  nav button.active { background: var(--bg); border-color: var(--line); color: var(--text); }
  main { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .page { flex: 1; min-height: 0; overflow-y: auto; padding: 24px 20px; }
  .card {
    max-width: 720px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 20px; line-height: 1.6; font-size: 14px;
  }
  .card h2 { margin: 0 0 8px; font-size: 16px; }
  .card p { margin: 0; color: var(--muted); }
  .counts { display: flex; gap: 12px; margin-top: 16px; flex-wrap: wrap; }
  .counts div { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
  .counts b { display: block; font-size: 20px; }
  .counts span { font-size: 12px; color: var(--muted); }

  #log {
    flex: 1; min-height: 0; overflow-y: auto; padding: 20px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .bubble {
    max-width: 70%; padding: 10px 14px; border-radius: 14px; line-height: 1.5;
    font-size: 14px; white-space: pre-wrap;
  }
  .row.user .bubble { background: var(--accent); color: white; border-bottom-right-radius: 4px; }
  .row.agent .bubble { background: var(--bubble); border-bottom-left-radius: 4px; }
  .steps { max-width: 70%; font-size: 12px; color: var(--muted); padding: 6px 14px;
           display: flex; flex-direction: column; gap: 3px; }
  .steps .step::before { content: "✓ "; color: var(--ok); }
  .prompt-box {
    flex-shrink: 0; max-width: 70%; margin-top: -4px; background: #17171f;
    border: 1px solid var(--line); border-radius: 10px; font-size: 12px; overflow: hidden;
  }
  .prompt-box summary { cursor: pointer; padding: 7px 12px; color: var(--accent-text); }
  .prompt-box pre {
    margin: 0; padding: 10px 12px; border-top: 1px solid var(--line); background: #11111a;
    color: #c3c3e0; white-space: pre-wrap; word-break: break-word; max-height: 320px; overflow-y: auto;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  form { display: flex; gap: 8px; padding: 14px 20px; background: var(--panel); border-top: 1px solid var(--line); }
  input {
    flex: 1; min-width: 0; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--line);
    background: var(--bg); color: var(--text); font-size: 14px;
  }
  input:focus { outline: 1px solid var(--accent); }
  form button {
    padding: 11px 20px; border-radius: 10px; border: none; background: var(--accent);
    color: white; font-size: 14px; cursor: pointer;
  }
  form button:disabled { background: var(--line); cursor: default; }
  @media (max-width: 640px) {
    nav { margin-left: 0; width: 100%; }
    .bubble, .steps, .prompt-box { max-width: 90%; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>요구사항 진척 관리</h1>
    <span class="meta">{{ meta }}</span>
    <nav>
      <button v-for="t in tabs" :key="t.id" :class="{ active: tab === t.id }" @click="tab = t.id">
        {{ t.label }}
      </button>
    </nav>
  </header>

  <main>
    <section v-if="tab !== 'chat'" class="page">
      <div class="card">
        <h2>{{ current.label }}</h2>
        <p>{{ current.desc }}</p>
        <div class="counts" v-if="counts">
          <div><b>{{ counts.requirements }}</b><span>요구사항</span></div>
          <div><b>{{ counts.criteria }}</b><span>완료 조건</span></div>
          <div><b>{{ counts.reports }}</b><span>완료 보고</span></div>
        </div>
      </div>
    </section>

    <template v-else>
      <div id="log" ref="logEl">
        <template v-for="item in log" :key="item.id">
          <div v-if="item.kind === 'user'" class="row user"><div class="bubble">{{ item.text }}</div></div>
          <div v-else-if="item.kind === 'steps'" class="steps">
            <div v-for="(step, i) in item.steps" :key="i" class="step">{{ step }}</div>
          </div>
          <div v-else-if="item.kind === 'agent'" class="row agent"><div class="bubble">{{ item.text }}</div></div>
          <details v-else-if="item.kind === 'prompt'" class="prompt-box">
            <summary>LLM에 전달된 프롬프트 보기</summary>
            <pre>{{ item.text }}</pre>
          </details>
        </template>
      </div>
      <form @submit.prevent="onSubmit">
        <input v-model="input" autocomplete="off" placeholder="예: 보안 요구사항 진행률 알려줘" />
        <button type="submit" :disabled="sending">보내기</button>
      </form>
    </template>
  </main>
</div>

<script src="https://unpkg.com/vue@3.4.38/dist/vue.global.prod.js"></script>
<script>
const { createApp, ref, reactive, computed, nextTick } = Vue;

const TABS = [
  { id: 'dashboard', label: '대시보드', desc: '전체 진척률, 분류별·담당자별 현황, 진척 추이, 위험 신호를 보여주고 검수용 엑셀을 내보냅니다. (준비 중)' },
  { id: 'report', label: '완료 보고', desc: '개발을 마치면 이름과 한 일을 자유롭게 적습니다. AI가 해당 요구사항과 충족한 완료 조건을 정리해 제안하고, 확인을 누르면 저장됩니다. (준비 중)' },
  { id: 'requirements', label: '요구사항', desc: '요구사항 명세서(엑셀)를 올리고, 요구사항별 완료 조건 체크리스트를 확정합니다. (준비 중)' },
  { id: 'chat', label: '채팅', desc: '' },
];

const ROUTE_LABELS = { chat: '일반 대화', status: '현황 질의', summary: '요약 요청' };
const STEP_LABELS = {
  RouteDecided: e => `질문 분류: ${ROUTE_LABELS[e.route] || e.route}`,
  Finalize: () => '답변 완료',
};

createApp({
  setup() {
    const tabs = TABS;
    const tab = ref('chat');
    const current = computed(() => TABS.find(t => t.id === tab.value));
    const meta = ref('');
    const counts = ref(null);
    const log = ref([]);
    const input = ref('');
    const sending = ref(false);
    const logEl = ref(null);
    const thread = 't-web-' + Math.random().toString(36).slice(2, 8);
    let nextId = 0;

    fetch('/health').then(r => r.json()).then(h => {
      meta.value = `${h.project_name} · ${h.llm_backend} (${h.fast_llm} / ${h.quality_llm})`;
      counts.value = h.counts;
    }).catch(() => { meta.value = '백엔드 연결 안 됨'; });

    async function scrollToBottom() {
      await nextTick();
      if (logEl.value) logEl.value.scrollTop = logEl.value.scrollHeight;
    }

    function onSubmit() {
      const text = input.value.trim();
      if (!text || sending.value) return;
      log.value.push({ id: nextId++, kind: 'user', text });
      input.value = '';
      sending.value = true;
      const stepsItem = reactive({ id: nextId++, kind: 'steps', steps: [] });
      log.value.push(stepsItem);
      scrollToBottom();

      const es = new EventSource(`/chat/stream?message=${encodeURIComponent(text)}&thread_id=${encodeURIComponent(thread)}`);
      let streamItem = null;

      es.onmessage = (event) => {
        if (event.data === '[DONE]') { es.close(); sending.value = false; return; }
        let e;
        try { e = JSON.parse(event.data); } catch { return; }

        if (e.type === 'AnswerToken') {
          if (!streamItem) {
            streamItem = reactive({ id: nextId++, kind: 'agent', text: '' });
            log.value.push(streamItem);
          }
          streamItem.text += e.delta;
        } else if (e.type === 'FinalAnswer') {
          if (!streamItem) {
            streamItem = reactive({ id: nextId++, kind: 'agent', text: '' });
            log.value.push(streamItem);
          }
          streamItem.text = e.reply;   // 토큰 합산 결과를 서버의 최종 텍스트로 맞춘다
          if (e.prompt) log.value.push({ id: nextId++, kind: 'prompt', text: e.prompt });
          streamItem = null;
        } else {
          const label = STEP_LABELS[e.type]?.(e);
          if (label) stepsItem.steps.push(label);
        }
        scrollToBottom();
      };
      es.onerror = () => { es.close(); sending.value = false; };
    }

    return { tabs, tab, current, meta, counts, log, input, sending, logEl, onSubmit };
  },
}).mount('#app');
</script>
</body>
</html>
